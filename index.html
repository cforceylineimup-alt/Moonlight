<style>

<script>
(()=>{"use strict";

const h=s=>{let x=5381;for(const c of String(s))x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};

const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={chat:sv('<path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/>'),story:sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'),rank:sv('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),tool:sv('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'),me:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),hash:sv('<path d="M5 9h14M5 15h14M10 3L8 21M16 3l-2 18"/>'),cam:sv('<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/>'),link:sv('<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>'),

const VB='<svg viewBox="0 0 24 24" style="width:16px;height:16px" aria-label="Terverifikasi"><path fill="#1DA1F2" d="M12 1l3 2 3.6-.3 1.3 3.4 3 2-1 3.5 1 3.5-3 2-1.3 3.4L15 21l-3 2-3-2-3.6.3-1.3-3.4-3-2 1-3.5-1-3.5 3-2 1.3-3.4L9 3z"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
const isV=u=>u&&(u.role==='admin'||u.role==='dev'),isP=u=>u&&(u.pm||u.role==='admin'),vb=u=>isV(u)?VB:'';
const nm=u=>`<span style="color:${isP(u)&&/^#[0-9a-f]{6}$/i.test(u.col||'')?u.col:'inherit'}">${esc(u.u)}</span>${vb(u)}`;
const md=(s,t)=>s&&/^data:(image|video)\//.test(s)?(t==='v'?`<video src="${esc(s)}" autoplay muted loop playsinline></video>`:`<img src="${esc(s)}" alt="">`):'';
const av=u=>md(u.av,u.avt)||`<span>${esc((u.u||'?')[0].toUpperCase())}</span>`;
const RX=['heart','like','star','bolt'],FIX=[['public','Publik'],['group','Grup'],['channel','Channel'],['comm','Community']];
const dmId=(a,b)=>'dm:'+[a,b].sort().join('|'),clean=t=>t.replace(/\b(anjing|babi|bangsat|kontol|memek|fuck|shit)\b/gi,'***');

/* ===== chat ===== */
const safe=d=>/^data:(image|video|audio)\//.test(d||'')?esc(d):'';

const d=safe(m.d);if(d){o+=m.k==='i'?`<img src="${d}" alt="">`:m.k==='v'?`<video src="${d}" controls playsinline></video>`:m.k==='a'?`<audio src="${d}" controls></audio>`:''}return o}

function rooms(){const o=Object.keys(db.users).filter(n=>n!==me.u).map(n=>[dmId(me.u,n),'Private: '+n]);$('#rl').innerHTML=FIX.concat(o).map(r=>`<button class="it ${room===r[0]?'a':''}" data-a="room" data-r="${esc(r[0])}">${r[0].startsWith('dm:')?I.me:I.hash}<span>${esc(r[1])}</span></button>`).join('')}

document.addEventListener('pointerdown',e=>{const b=e.target.closest('#th .b');if(b)lp=setTimeout(()=>zoom(b.parentNode.dataset.id),500)});['pointerup','pointermove','pointercancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lp)));
/* ===== views ===== */
const NAV=[['chat','Chat'],['story','Story'],['rank','Rank'],['tool','Unduh','tools'],['me','Profil']];
function show(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({chat:()=>{rooms();draw()},story:st,rank:rk,me:pf}[v]||(()=>{}))()}
function hdr(){$('#hp').innerHTML=`<div class="av">${av(me)}</div><div>${nm(me)}<br><small>Lv ${me.lv||1}</small></div>`}
function st(){const now=Date.now();db.stories=db.stories.filter(s=>now-s.ts<864e5);const g={};db.stories.forEach(s=>g[s.u]=s);$('#v-story').innerHTML=`<h3 style="margin-bottom:8px">Story 24 jam</h3><div class="sr"><div class="sc" data-a="addst"><div class="ring add">+</div><small>Status saya</small></div>${Object.keys(g).map(n=>`<div class="sc" data-a="vst" data-u="${esc(n)}"><div class="ring"><div class="av">${av(db.users[n]||{u:n})}</div></div><small>${esc(n)}</small></div>`).join('')}</div>`}
function rk(){const l=Object.values(db.users).sort((a,b)=>(b.lv||0)-(a.lv||0)).slice(0,10);$('#v-rank').innerHTML='<h3 style="margin-bottom:10px">Leaderboard Top 10</h3>'+l.map((u,i)=>`<div class="glass rw"><b>${i+1}</b><div class="av s">${av(u)}</div><div class="g1"><span style="display:flex;gap:4px;align-items:center">${nm(u)}</span><small>Level ${u.lv||1}</small></div>${u.u!==me.u?`<button class="sm" data-a="fol" data-u="${esc(u.u)}">${(me.fg||[]).includes(u.u)?'Mengikuti':'Ikuti'}</button>`:''}</div>`).join('')}
const RT=['Pasangan','Saudara','Temen','Teman Dekat','Keluarga'],RI=['heart','users','like','star','home'];
function pf(){const u=me,fl=Object.values(db.users).filter(x=>(x.fg||[]).includes(u.u)).length,fg=(u.fg||[]).length,fr=(u.fg||[]).filter(n=>db.users[n]&&(db.users[n].fg||[]).includes(u.u)).length,rl=u.rel&&RT.includes(u.rel.t)?`<span style="display:flex;gap:6px;align-items:center">${I[RI[RT.indexOf(u.rel.t)]]}${esc(u.rel.t)}: ${esc(u.rel.n)}</span>`:'<span class="mu">Hubungan: kosong</span>';
$('#v-me').innerHTML=`<div class="glass pc"><div class="bn">${md(u.bn,u.bnt)}<button class="sm" data-a="bn">${I.cam}Banner</button></div><div class="avw"><div class="av big">${av(u)}</div><button class="sm" data-a="av">Ganti foto/video</button></div>
<h3 style="display:flex;gap:6px;align-items:center">${nm(u)}</h3><small>${u.role==='admin'?'ADMIN':u.role==='dev'?'DEVELOPER':'Pengguna'} · Level ${u.lv||1}${isP(u)?' · Premium':''}</small><p style="margin-top:6px">${esc(u.st||'')}</p>${rl}
<div class="stt"><div><b>${fr}</b><small>Teman</small></div><div><b>${fl}</b><small>Pengikut</small></div><div><b>${fg}</b><small>Mengikuti</small></div></div></div>
<div class="glass pc"><h4>Edit profil</h4><input id="eu" value="${esc(u.u)}" maxlength="16" placeholder="Username"><input id="ep" type="password" placeholder="Password baru (kosongkan jika tidak diganti)"><input id="es" value="${esc(u.st||'')}" maxlength="80" placeholder="Status">${isP(u)?`<small>Warna nama (Premium)</small><input id="ec" type="color" value="${/^#[0-9a-f]{6}$/i.test(u.col||'')?u.col:'#2AABEE'}">`:''}<button class="pri" data-a="saveP" style="width:100%;margin-top:6px">Simpan</button></div>
<div class="glass pc"><h4>Afinitas</h4><div class="row"><select id="rt">${RT.map(t=>`<option>${t}</option>`).join('')}</select><input id="rn" placeholder="Username pasangan"></div><div class="row"><button class="pri" data-a="rel">Simpan</button><button data-a="unrel">Hapus Hubungan</button></div></div>
<div class="glass pc"><h4>Premium</h4><small>Banner foto gratis, banner video khusus Premium. Rp 50.000/bulan.</small><input id="vc" placeholder="Kode voucher"><div class="row"><button class="pri" data-a="vcr">Tukar</button><button data-a="buy">Beli, chat Admin</button></div></div>
<div class="glass pc"><h4>Latar Musik</h4><div class="row"><button data-a="mus">Upload audio/video</button><button data-a="mpp">Play/Pause</button></div><div class="row"><input type="range" id="mv" min="0" max="1" step=".05" value="${bg.volume}" data-a="mvol"><label class="mu"><input type="checkbox" id="ml" data-a="mloop" style="width:auto" ${bg.loop?'checked':''}> Loop</label></div></div>
${u.role==='admin'?`<div class="glass pc"><h4>Panel Admin</h4><input id="a1" placeholder="Username target"><input id="a2" placeholder="Kode premium"><div class="row"><button class="pri" data-a="apm">Premium-kan</button><button data-a="adev">Jadikan Dev</button><button data-a="adel">Hapus akun</button></div></div>`:''}
<div class="glass pc"><h4>Hapus akun</h4><input id="d1" placeholder='Ketik "Delete Account"'><input id="d2" placeholder="Alasan" maxlength="200"><button data-a="del" style="width:100%">Hapus akun saya</button></div><button data-a="out" style="width:100%;margin-bottom:12px">Keluar</button>`}
/* ===== state ===== */
const bg=new Audio();bg.volume=.6;bg.loop=true;
const pushU=()=>{db.users[me.u]=me;save();post({t:'u',x:me})},sync=()=>{db.users[me.u]&&(db.users[me.u]=me);save();post({t:'s',db})},upd=full=>{full?sync():pushU();hdr();pf()};
const lvUp=n=>{me.lv=me.role==='admin'?9999:(me.lv||1)+n};
const fix=()=>{if(me&&me.role==='admin')me.lv=9999};
if(bc)bc.onmessage=e=>{const d=e.data||{};try{
if(d.t==='m'&&me)inc(d.m);
else if(d.t==='r'){const m=db.msgs.find(o=>o.id===d.id);if(m&&d.rx&&typeof d.rx==='object'){m.rx=d.rx;if(me&&m.room===room)draw()}}
else if(d.t==='u'&&d.x&&typeof d.x.u==='string'){db.users[d.x.u]=d.x;if(me&&d.x.u===me.u)me=d.x}
else if(d.t==='s'&&d.db&&d.db.users){db=d.db;db.msgs=db.msgs||[];db.stories=db.stories||[];if(me){me=db.users[me.u];if(!me){toast('Akun tidak ditemukan',1);out();return}hdr()}}}catch(_){}};
const A={
tab(a){$$('.tabs button').forEach(b=>b.classList.toggle('on',b===a));$('#ac').style.display=a.dataset.v==='1'?'block':'none'},
login(){const u=$('#au').value.trim(),p=$('#ap').value,c=$('#ac').value.trim(),adm=$('#ac').style.display!=='none';
if(!/^[A-Za-z0-9_]{3,16}$/.test(u))return toast('Username 3-16 karakter: huruf, angka, _',1);if(p.length<4)return toast('Password minimal 4 karakter',1);if(adm&&c!=='RYUKA5522')return toast('Kode admin salah',1);
let x=db.users[u];if(x){if(x.p!==h(p))return toast('Password salah',1);if(x.role==='admin'&&!adm)return toast('Akun admin: masuk lewat tab Admin',1);if(adm)x.role='admin'}
else x=db.users[u]={u,p:h(p),role:adm?'admin':'user',lv:1,min:0,st:'Halo, saya pakai What\'sMoon',fg:[],pm:0};
me=x;fix();ls('wm_ses',u);sync();enter()},
nav(a){show(a.dataset.v)},back(){$('#v-chat').classList.remove('open')},
room(a){const r=a.dataset.r;if(!okRoom(r))return toast('Ruang tidak valid',1);room=r;$('#v-chat').classList.add('open');rooms();draw()},
snd(){send()},att(){pick('image/*,video/*',(d,k)=>send({k,d}))},mic(){vn()},
rx(a){const m=db.msgs.find(o=>o.id===a.dataset.id),k=a.dataset.k;if(!m||!RX.includes(k))return;m.rx=m.rx||{};const l=m.rx[k]=m.rx[k]||[],i=l.indexOf(me.u);i<0?l.push(me.u):l.splice(i,1);save();post({t:'r',id:m.id,rx:m.rx});closeOv();draw()},
addst(){pick('image/*,video/*',(d,k)=>{db.stories.push({id:Date.now().toString(36),u:me.u,d,k,ts:Date.now()});lvUp(1);upd(true);st();toast('Status diunggah, +1 Level')})},
vst(a){const s=db.stories.filter(x=>x.u===a.dataset.u).pop();if(!s)return;$('#ov').innerHTML=`<b>${esc(s.u)}</b>${md(s.d,s.k==='v'?'v':'i').replace('autoplay muted loop','autoplay controls loop')}<small>${new Date(s.ts).toLocaleTimeString('id-ID',{hour12:false})}</small>`;$('#ov').classList.add('on')},
fol(a){const n=a.dataset.u;if(!db.users[n])return;me.fg=me.fg||[];const i=me.fg.indexOf(n);i<0?me.fg.push(n):me.fg.splice(i,1);upd();rk()},
bn(){pick('image/*,video/*',(d,k)=>{if(k==='v'&&!isP(me))return toast('Banner video khusus Premium',1);me.bn=d;me.bnt=k;upd(true)})},
av(){pick('image/*,video/*',(d,k)=>{me.av=d;me.avt=k;upd(true)})},
saveP(){const n=$('#eu').value.trim(),p=$('#ep').value,s=$('#es').value.trim().slice(0,80),c=$('#ec')&&$('#ec').value;let full=false;
if(n!==me.u){if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return toast('Username tidak valid',1);if(db.users[n])return toast('Username sudah dipakai',1);const o=me.u;delete db.users[o];me.u=n;db.users[n]=me;db.msgs.forEach(m=>{if(m.u===o)m.u=n});db.stories.forEach(m=>{if(m.u===o)m.u=n});Object.values(db.users).forEach(x=>{x.fg=(x.fg||[]).map(y=>y===o?n:y)});ls('wm_ses',n);full=true}
if(p){if(p.length<4)return toast('Password minimal 4 karakter',1);me.p=h(p)}if(s)me.st=s;if(c&&/^#[0-9a-f]{6}$/i.test(c))me.col=c;upd(full);toast('Profil tersimpan')},
rel(){const n=$('#rn').value.trim(),t=$('#rt').value;if(!db.users[n]||n===me.u)return toast('Pengguna tidak ditemukan',1);if(!RT.includes(t))return;me.rel={n,t};upd()},unrel(){me.rel=null;upd();toast('Hubungan dihapus')},
vcr(){if($('#vc').value.trim()==='glass5522'){me.pm=1;upd();toast('Premium aktif')}else toast('Voucher salah',1)},
buy(){const ad=Object.values(db.users).find(u=>isV(u)&&u.u!==me.u);if(!ad)return toast('Admin belum tersedia',1);room=dmId(me.u,ad.u);show('chat');$('#v-chat').classList.add('open');rooms();draw()},
mus(){pick('audio/*,video/*',d=>{bg.src=d;bg.play().catch(()=>toast('Tekan Play untuk memulai',1))})},
mpp(){if(!bg.src)return toast('Pilih file musik dulu',1);bg.paused?bg.play().catch(()=>toast('Gagal memutar',1)):bg.pause()},
apm(){const x=db.users[$('#a1').value.trim()];if(!x)return toast('User tidak ada',1);if($('#a2').value.trim()!=='Buy-Premium.account')return toast('Kode premium salah',1);x.pm=1;sync();toast('Premium diaktifkan')},
adev(){const x=db.users[$('#a1').value.trim()];if(!x||x.role==='admin')return toast('User tidak valid',1);x.role='dev';sync();toast('Jadi Developer')},
adel(){const n=$('#a1').value.trim(),x=db.users[n];if(!x||x.role==='admin')return toast('User tidak valid',1);delete db.users[n];db.stories=db.stories.filter(s=>s.u!==n);sync();toast('Akun dihapus')},
del(){if($('#d1').value!=='Delete Account')return toast('Ketik persis: Delete Account',1);if($('#d2').value.trim().length<3)return toast('Isi alasan penghapusan',1);const n=me.u;delete db.users[n];db.stories=db.stories.filter(s=>s.u!==n);me=null;ls('wm_ses',null);save();post({t:'s',db});location.reload()},
out(){out()},
async dl(){const u=$('#tu').value.trim();if(!/^https?:\/\/\S+$/.test(u))return toast('Link tidak valid',1);try{const r=await fetch('https://www.tikwm.com/api?url='+encodeURIComponent(u)),j=await r.json(),d=j&&j.data,v=d&&(d.hdplay||d.play);if(!/^https:\/\//.test(v||''))throw 0;$('#dr').innerHTML=`<p>${esc(d.title||'Video')}</p><video src="${esc(v)}" controls playsinline style="width:100%;border-radius:12px"></video><a href="${esc(v)}" download target="_blank" rel="noopener noreferrer"><button class="pri" style="width:100%;margin-top:8px">Simpan video</button></a>`}catch(e){toast('Gagal mengambil video. Cek link atau koneksi',1)}}};
function out(){ls('wm_ses',null);location.reload()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a]&&a.tagName!=='INPUT')A[a.dataset.a](a);if(e.target.id==='ov')closeOv()});
document.addEventListener('input',e=>{if(e.target.id==='mv')bg.volume=+e.target.value||0});document.addEventListener('change',e=>{if(e.target.id==='ml')bg.loop=e.target.checked});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in')send();if(e.key==='Escape')closeOv()});
function enter(){$('#auth').style.display='none';$('#app').style.display='flex';$('#nav').innerHTML=NAV.map(n=>`<button data-a="nav" data-v="${n[2]||n[0]}">${I[n[0]==='tool'?'tool':n[0]]}${n[1]}</button>`).join('');hdr();show('chat')}
setInterval(()=>{if(!me)return;me.min=(me.min||0)+1;if(me.min%60===0)lvUp(2);if(me.min%180===0)lvUp(1);fix();pushU();hdr()},60000);
setTimeout(()=>{$('#splash').classList.add('x');setTimeout(()=>$('#splash').remove(),500);const s=ls('wm_ses');if(s&&db.users[s]){me=db.users[s];fix();enter()}else $('#auth').style.display='flex'},1500);
})();
</script></body></html>
